packages:
  - 'apps/*'
  - 'packages/*'
  - 'content'
allowBuilds:
  # esbuild's postinstall only validates the platform binary that already arrives as an optional dependency.
  esbuild: false
  # unrs-resolver ships prebuilt binaries; its postinstall is only a download fallback.
  unrs-resolver: false
  # workerd (from wrangler, #511) gets its binary from the @cloudflare/workerd-<platform> optional
  # dependency; its postinstall only checks it or downloads it as a fallback.
  workerd: false
# Supply chain (#526): a version must have been on the registry for 3 days (4320 minutes) before
# pnpm resolves it, which leaves time to pull a hijacked release. Workspace packages are exempt.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@trayectoria/*'
# `pnpm run` and `pnpm exec` stop when node_modules does not match the lockfile.
verifyDepsBeforeRun: error
overrides:
  # GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p (#642): brace-expansion arrives only through dev tooling
  # (eslint, typescript-eslint, minimatch). Remove once eslint and typescript-eslint ship the patched versions.
  brace-expansion@<1.1.20: 1.1.20
  brace-expansion@>=4.0.0 <5.0.11: 5.0.11
  # miniflare (from wrangler 4.141.0, #511) asks for undici 7.29.0, which carries two high advisories
  # (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3); 7.29.1 fixes them and wrangler only picks it up from
  # 4.143.1. Remove this override once wrangler is at 4.143.1 or later.
  'undici@7': '7.29.1'
