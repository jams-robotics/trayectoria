# Version updates (#515). Security updates are switched on in Settings → Code security.
# Dependabot waits 3 days after a release, the same as pnpm's minimumReleaseAge (#526).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    groups:
      # Minor and patch bumps travel together in one PR; each major gets its own.
      npm-minor-patch:
        update-types: [minor, patch]
    labels: [type:infra]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
    labels: [type:infra]
    commit-message:
      prefix: ci(deps)

  # The base images of infra/web.Dockerfile, pinned by digest (#525).
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    labels: [type:infra]
    commit-message:
      prefix: build(deps)
